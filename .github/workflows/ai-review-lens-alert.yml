# AI Review Lens Alert — raises an issue when one council lens keeps failing.
#
# WHY. The 2026-10-27 diagnosis (DL-20261023-401) found 17/54 councils degraded
# while the daily model-health probe stayed green. Each individual council still
# reported a verdict, and `max_degraded_lenses: 1` tolerates one failed lens as
# "degraded" — so a lens that fails twice in a day leaves no trace a human would
# notice. This reader surfaces exactly that pattern from the coverage records.
#
# HOW IT RUNS. Like the streak reader, the artifacts live on the CALLING
# repository's runs and `actions: read` on a private repository is only granted
# to that repository's own token. So this is a reusable workflow the consumer
# schedules (daily), and it reads `${{ github.repository }}` with the consumer's
# token. No cross-repo secret exists.
#
# OBSERVABILITY, NOT A GATE. Finding failures exits 0 and opens/updates one
# issue per lens. A non-zero exit is reserved for FAULTS: no readable council
# records in the window (an "all clear" over an empty sample would be a check
# that cannot fail).
name: AI Review Lens Alert

on:
  workflow_call:
    inputs:
      limit:
        type: string
        default: '20'
        description: 'Newest N caller runs to inspect, merged across the listed workflows.'
      window_hours:
        type: string
        default: '24'
        description: 'Rolling window, in hours, anchored on the newest council record.'
      threshold:
        type: string
        default: '2'
        description: 'Failures of one lens inside the window that raise the alert.'
      workflows:
        type: string
        default: 'ai-code-review.yml,ai-review-on-demand.yml'
        description: 'Comma-separated caller workflow files whose runs carry the ai-review-coverage artifact.'

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  alert:
    name: AI Review Lens Alert
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The reader is checked out from the CALLED workflow's own commit, the same
      # identity contract the coverage gate uses: the code reviewed is the code
      # that runs, and a caller cannot pin the workflow to one revision and
      # execute another.
      - name: Checkout coverage gate scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ai-review-gate
          sparse-checkout: scripts/ai-review-coverage
          persist-credentials: false
          fetch-depth: 1

      - name: Read coverage entries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node .ai-review-gate/scripts/ai-review-coverage/read-coverage-streak.mjs \
            --repo "$GITHUB_REPOSITORY" \
            --limit "${{ inputs.limit }}" \
            --workflows "${{ inputs.workflows }}" \
            --entries "$RUNNER_TEMP/entries.json"

      - name: Compute lens failures
        id: alert
        run: |
          set -euo pipefail
          node .ai-review-gate/scripts/ai-review-coverage/lens-failure-alert.mjs \
            --entries "$RUNNER_TEMP/entries.json" \
            --window-hours "${{ inputs.window_hours }}" \
            --threshold "${{ inputs.threshold }}" \
            --markdown "$RUNNER_TEMP/alert.md" \
            --github-output

      # One tracking issue per lens: an existing open issue is commented on, so a
      # repeating failure builds a timeline instead of a pile of issues.
      - name: Raise or update the tracking issue
        if: steps.alert.outputs.alert == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          while IFS= read -r lens; do
            [ -n "$lens" ] || continue
            title="AI council lens alert: ${lens}"
            number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"${title}\"" \
              --json number,title --jq ".[] | select(.title == \"${title}\") | .number" | head -1 || true)
            if [ -n "$number" ]; then
              gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/alert.md"
            else
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file "$RUNNER_TEMP/alert.md"
            fi
          done < <(printf '%s' "${{ steps.alert.outputs.lenses }}" | tr ',' '\n')
