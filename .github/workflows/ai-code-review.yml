# EHA Clinics - AI Code Review Reusable Workflow
# Uses elek (model-agnostic AI code review) via OpenRouter (pi's native adapter).
#
# Council strategy: a multi-lens review (4 read-only lenses) with z-ai/glm-5.1 as the
# validator that reconciles findings before posting. Cost is bounded by max_cost_usd
# using per-model cost_rates.
# Structural safety: elek's MCP server only exposes create_inline_comment and
# update_tracking_comment — there are no approve/merge/close code paths.
#
# ─── elek pin: v1.1.4 = 3748508413fb355ae696b8fa98d1075930d12106 (EHAC-2057) ───────────
# The previous pin was an UNTAGGED main commit (88813716, 2026-06-16), chosen when no
# release tag exposed the council+cost-control inputs. That is no longer true: v1.1.4's
# action.yml input surface is a strict SUPERSET of everything this workflow passes, so the
# tag replaces the untagged commit. v1.1.4 beats the old pin on the two mechanisms that
# produced EHAC-2057, and beats `main` (cbb7202b) because main is untagged, unreleased and
# its `src/review/diff-context.ts` is byte-identical to v1.1.4 — zero extra gain here.
#
# EHAC-2057 root cause, one line: `AI Review (Council)` reported a green pass on eha_care
# PR #3515 while the entire 298-line tenant-isolation primitive sat outside the model's
# prompt window — a raw 60,000-char `String.slice` of the diff (old pin
# `src/review/strategy.ts:282`) dropped it, acceptance gates converted the missing context
# into silence, and the changed-line threshold had silently downgraded council to a 2-lens
# crosscheck so the check name reported a strategy that never ran.
#
# This workflow therefore emits a SECOND, separately-named signal — `AI Review Coverage` —
# that goes red when a production-source file was truncated out of the review prompt. The
# `AI Review (Council)` job keeps its existing name and pass/fail meaning: "review
# incomplete" and "review broken" stay separate signals.
#
# Fault 3 warning, so nobody re-derives the idea: `ignore_paths` in `.elek.yml` is PROMPT
# TEXT ONLY at every elek ref (there is no glob matcher anywhere in elek's source). It does
# NOT filter `data.diff` and reclaims NO prompt budget. Path-sharding a review via
# `config_path` + generated `ignore_paths` is structurally impossible.
#
# NOTE: We previously routed through the Databricks AI Gateway (provider: openai,
# OpenAI-compatible). elek's pi client hung indefinitely on tool-enabled
# reasoning-model requests through that generic-adapter path — independent of
# thinking level, max_turns, and elek version. OpenRouter is elek's tested path.
# PII note: the gateway did input-PII masking; direct OpenRouter does not, but the
# diff already egressed to the same OpenRouter providers via the gateway.
#
# Security:
# - Actions pinned to full commit SHAs.
# - Least-privilege permissions: contents: read, pull-requests: write.
# - The MCP server has no code paths for approve/merge/close.
# - Token sanitization redacts GitHub token prefixes from model output.
#
# Usage:
#   jobs:
#     review:
#       uses: EHA-Clinics/.github/.github/workflows/ai-code-review.yml@<SHA-PIN>
#       secrets:
#         OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
#       with:
#         review_strategy: 'council'

name: AI Code Review

on:
  workflow_call:
    inputs:
      model:
        type: string
        default: 'deepseek/deepseek-v4-pro'
        description: 'OpenRouter model id (e.g., deepseek/deepseek-v4-pro, xiaomi/mimo-v2.5-pro)'
      trigger_phrase:
        type: string
        default: '@ai-review'
        description: >
          Phrase in the PR body or a comment that triggers a review. elek's own
          default is "@pi"; EHA standardizes on "@ai-review" (used in PR templates
          and the on-demand workflow gate). Without this, elek looks for "@pi",
          finds nothing, and exits "No trigger detected" — posting no review.
      thinking:
        type: string
        default: 'high'
        description: 'Reasoning effort: off, minimal, low, medium, high, xhigh'
      max_turns:
        type: number
        default: 20
        description: 'Maximum conversation turns per review'
      review_strategy:
        type: string
        default: 'council'
        description: 'elek review strategy. council = multi-lens review + validator reconciliation.'
      review_models:
        type: string
        # GLM is provider-qualified as `openrouter/z-ai/glm-5.1`: in council mode elek omits
        # `--provider` for slashed ids (src/pi.ts), and pi self-routes a bare `z-ai/*` id to
        # NVIDIA (no key -> hang). The `openrouter/` prefix forces OpenRouter. deepseek/* and
        # xiaomi/* already resolve to OpenRouter, so only GLM needs the explicit prefix.
        default: 'deepseek/deepseek-v4-pro,xiaomi/mimo-v2.5-pro,openrouter/z-ai/glm-5.1'
        description: 'Comma-separated OpenRouter model ids for the council lenses (round-robin assigned).'
      validator_model:
        type: string
        default: 'openrouter/z-ai/glm-5.1'
        description: 'Model that reconciles/validates lens findings before posting (openrouter/ prefix forces OpenRouter routing for the GLM id).'
      severity_threshold:
        type: string
        default: 'important'
        description: 'Minimum severity to surface: critical | important | minor.'
      max_cost_usd:
        type: string
        default: '0.25'
        description: 'Per-review USD budget cap (string; elek expects a string, not a number).'
      cost_rates:
        type: string
        default: 'openrouter/z-ai/glm-5.1=0.98:3.08,xiaomi/mimo-v2.5-pro=0.435:0.87'
        description: 'Per-model cost rates as model=inputPerMillion:outputPerMillion, comma-separated.'
      mode:
        type: string
        default: 'review'
        description: 'review (read-only) or review+edit (pushes fixes to pi/* branch)'
      max_council_changed_lines:
        type: string
        default: '0'
        description: >
          Changed-line warning threshold for council/thermos; '0' disables it.
          EHAC-2057 Fault 5: at the OLD pin (88813716) the default was 1_200 and a
          for(;;) loop silently downgraded council -> crosscheck -> solo on any large
          PR, so the job named "AI Review (Council)" ran a 2-lens crosscheck on
          eha_care #3515 (2,432 changed lines). At v1.1.4 the downgrade loop is gone
          and the threshold is warn-only, but we set it explicitly so the behaviour is
          self-documenting and pin-independent (CONTEXT D-05(i)).
      actor_filter:
        type: string
        default: ''
        description: >
          Comma-separated usernames allowed to trigger a review. Compensating control
          for T-2057-02/T-2057-03: at v1.1.4 an EMPTY value means *all humans* can
          trigger a run that holds OPENROUTER_API_KEY and a pull-requests: write token,
          while `getGitDiff` still interpolates the head branch name into execSync and
          git refnames legally permit shell metacharacters. Callers supply an explicit
          allowlist. An actor outside the list makes elek decline before reviewing,
          which the coverage gate reports as NOT_REVIEWED (green + a loud warning), so
          bot-authored PRs do not produce a red storm.
    secrets:
      OPENROUTER_API_KEY:
        required: true
        description: 'OpenRouter API key (same key that backs the Databricks AI Gateway external-model endpoints)'

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: AI Code Review (${{ inputs.review_strategy }})
    runs-on: ubuntu-latest
    # 10 min was too tight: dual-model thinking:high reviews of large diffs were
    # killed mid-run (job cancelled before posting), leaving stuck "analyzing…"
    # tracking comments. 20 gives headroom for the full-history checkout + review.
    timeout-minutes: 20
    steps:
      - name: Checkout PR
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: AI Code Review via OpenRouter
        # `id: review` is load-bearing (EHAC-2057 Fault 4): elek's action.yml has declared
        # review_summary_json / review_summary_path / input_tokens / output_tokens /
        # cost_usd / conclusion as outputs at EVERY ref, and all of them were unreachable
        # purely for want of a step id. The coverage measurement below consumes them.
        id: review
        uses: selimozten/elek@3748508413fb355ae696b8fa98d1075930d12106 # v1.1.4
        with:
          # pi's native openrouter adapter — elek's tested path. The OpenAI-compatible
          # Databricks AI Gateway (provider: openai) hung pi indefinitely on tool-enabled
          # reasoning-model requests, regardless of thinking/max_turns/elek version.
          provider: openrouter
          openrouter_api_key: ${{ secrets.OPENROUTER_API_KEY }}
          # Council strategy + per-model cost control.
          review_strategy: ${{ inputs.review_strategy }}
          review_models: ${{ inputs.review_models }}
          validator_model: ${{ inputs.validator_model }}
          severity_threshold: ${{ inputs.severity_threshold }}
          max_cost_usd: ${{ inputs.max_cost_usd }}
          cost_rates: ${{ inputs.cost_rates }}
          # EHAC-2057 Fault 5 mitigation + T-2057-02 compensating control.
          max_council_changed_lines: ${{ inputs.max_council_changed_lines }}
          actor_filter: ${{ inputs.actor_filter }}
          # Primary/fallback model + reasoning knobs.
          model: ${{ inputs.model }}
          trigger_phrase: ${{ inputs.trigger_phrase }}
          thinking: ${{ inputs.thinking }}
          max_turns: ${{ inputs.max_turns }}
          mode: ${{ inputs.mode }}
          sticky_comment: true
          # Structural safety: elek's MCP server only exposes create_inline_comment
          # and update_tracking_comment. No approve/merge/close code paths exist.
          # Path exclusion is no longer a workflow input — it lives in .elek.yml
          # ignore_paths (elek does not accept file-pattern inputs at this SHA).
