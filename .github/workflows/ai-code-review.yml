# EHA Clinics - AI Code Review Reusable Workflow
# Uses elek (model-agnostic AI code review) via OpenRouter (pi's native adapter).
#
# Council strategy: a multi-lens review (4 read-only lenses) with deepseek-v4-pro as the
# validator that reconciles findings before posting. Cost is bounded by max_cost_usd
# using per-model cost_rates.
# Structural safety: elek's MCP server only exposes create_inline_comment and
# update_tracking_comment — there are no approve/merge/close code paths.
#
# ─── elek pin: eha-v1.4.2 (full immutable SHA below) ──────────────────────────
# The EHA fork supplies the fail-closed coverage record, bounded council execution, and
# pinned MCP dependencies used by this workflow. The separately named `AI Review Coverage`
# job fails when a production-source file was omitted from the prompt or the requested
# council did not execute. Keep the action and coverage-gate pins immutable and aligned.
#
# NOTE: We previously routed through the Databricks AI Gateway (provider: openai,
# OpenAI-compatible). elek's pi client hung indefinitely on tool-enabled
# reasoning-model requests through that generic-adapter path — independent of
# thinking level, max_turns, and elek version. OpenRouter is elek's tested path.
# PII note: the gateway did input-PII masking; direct OpenRouter does not, but the
# diff already egressed to the same OpenRouter providers via the gateway.
#
# Security:
# - Actions pinned to full commit SHAs.
# - Least-privilege permissions: contents: read, pull-requests: write.
# - The MCP server has no code paths for approve/merge/close.
# - Token sanitization redacts GitHub token prefixes from model output.
#
# Usage:
#   jobs:
#     review:
#       uses: EHA-Clinics/.github/.github/workflows/ai-code-review.yml@<SHA-PIN>
#       secrets:
#         OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
#       with:
#         review_strategy: 'council'

name: AI Code Review

on:
  workflow_call:
    inputs:
      model:
        type: string
        default: 'deepseek/deepseek-v4-pro'
        description: 'OpenRouter model id (e.g., deepseek/deepseek-v4-pro, xiaomi/mimo-v2.5-pro)'
      trigger_phrase:
        type: string
        default: '@ai-review'
        description: >
          Phrase in the PR body or a comment that triggers a review. elek's own
          default is "@pi"; EHA standardizes on "@ai-review" (used in PR templates
          and the on-demand workflow gate). Without this, elek looks for "@pi",
          finds nothing, and exits "No trigger detected" — posting no review.

          EHAC-2099 — this description previously stopped at the sentence above, which
          names only HALF the failure mode. Setting the phrase is necessary but NOT
          sufficient: `detectTrigger` (elek src/github/trigger.ts:24) searches for it in
          `triggerText`, and on a `pull_request` event that text is the PR BODY. So a
          correctly-configured phrase still yields "No trigger detected" whenever the body
          does not happen to contain it. Auto-review therefore worked only because
          eha_care's .github/pull_request_template.md carries "@ai-review" in its footer;
          any hand-written body silently skipped review while this job reported pass
          (observed on eha_care #3530: elek exited in 1.98s, conclusion "skipped").

          As of EHAC-2099 this input NO LONGER governs the pull_request path at all — the
          `prompt` passed to the elek step below short-circuits trigger detection for PR
          events. It still governs the comment paths (issue_comment /
          pull_request_review_comment) used by ai-review-on-demand.yml.
      thinking:
        type: string
        default: 'high'
        description: 'Reasoning effort: off, minimal, low, medium, high, xhigh'
      max_turns:
        type: number
        # Raised 20 -> 30 on 2026-08-16. At 20 the `tests` lane was flaking against the
        # ceiling, not against the diff: on the eha-care-infra wave-1 PR it hit
        # `pi exceeded max turns (20)` on deepseek-v4-flash on BOTH the initial attempt
        # and the fork's one retry, so elek exited `Required review lanes failed: tests`.
        # The run after that passed the same lane on a near-identical diff at 18 turns —
        # two turns of margin, having already failed twice at the ceiling.
        #
        # A run that dies at max_turns has paid for all 20 and produced nothing, so the
        # headroom is close to free: turns are consumed on demand, and a lane that
        # finishes in 8 is unaffected by the higher cap. Only the runs currently burning
        # a full budget to fail cost more, and they now stand a chance of succeeding.
        #
        # It also gets more necessary as the fleet re-pins. The fork derives the per-file
        # slice budget from the model's input budget instead of a flat ~4,000 characters,
        # so a re-pinned repo sends materially MORE code per review — the same pressure
        # that produced the flake in the first place, applied to 11 repos still to onboard.
        default: 30
        description: 'Maximum conversation turns per review'
      review_strategy:
        type: string
        default: 'council'
        description: 'elek review strategy. council = multi-lens review + validator reconciliation.'
      review_models:
        type: string
        # EHAC-2466 — GLM 5.3 Flash is a distinct-model Operations lens trial. Keeping the
        # three established models in their existing positions makes the comparison observable
        # without changing the Risk, Design, or Tests lanes. It replaces the Operations lane's
        # previous round-robin model, so the number of executions and validation semantics stay
        # unchanged; DeepSeek V4 Pro remains the validator.
        default: 'deepseek/deepseek-v4-pro,xiaomi/mimo-v2.5-pro,deepseek/deepseek-v4-flash,openrouter/z-ai/glm-5.3-flash'
        description: 'Comma-separated OpenRouter model ids for the council lenses (round-robin assigned).'
      validator_model:
        type: string
        default: 'deepseek/deepseek-v4-pro'
        description: 'Model that reconciles and validates lens findings before posting.'
      severity_threshold:
        type: string
        default: 'important'
        description: 'Minimum severity to surface: critical | important | minor.'
      max_cost_usd:
        type: string
        default: '1.00'
        description: 'Per-review USD budget cap (string; elek expects a string, not a number).'
        # RAISED 0.25 -> 1.00 (2026-08-15). Not a spend decision — a correctness one. A breach
        # does not warn: selectReviewPlanWithinBudget DOWNGRADES council -> crosscheck -> solo,
        # which makes strategy.requested != strategy.executed, which the coverage gate reports
        # as U3 -> UNKNOWN -> exit 1. So a cap set near the true cost converts a normal review
        # into a red advisory coverage result. Anchored to a measured run: kemiqa PR #362 logged
        # planned_minimum_input_cost $0.1392 against a 200,000-char budget with a 4-lens council
        # plus validator; the packer's default budget is now 320,000, which scales that to
        # ~$0.223 against the old $0.25 cap — inside the noise. Real cost falls well below 1.00
        # once exclude_paths drops planning artifacts and lockfiles from the prompt; the cap
        # exists for the worst case, not the typical one.
      cost_rates:
        type: string
        # EHAC-2466: GLM 5.3 Flash is budgeted conservatively at its standard $0.15/$0.50
        # per-million-token rates rather than the lower introductory OpenRouter promotion.
        # DeepSeek V4 Pro resolves natively; the remaining entries are explicit fallbacks for
        # models whose pricing elek may not resolve from the provider.
        default: 'xiaomi/mimo-v2.5-pro=0.435:0.87,deepseek/deepseek-v4-flash=0.14:0.28,openrouter/z-ai/glm-5.3-flash=0.15:0.50'
        description: 'Per-model cost rates as model=inputPerMillion:outputPerMillion, comma-separated.'
      mode:
        type: string
        default: 'review'
        description: 'review or review+edit; both currently use the same read-only surface'
      max_council_changed_lines:
        type: string
        default: '0'
        description: >
          RETIRED 2026-08-15 — ACCEPTED BUT NO LONGER FORWARDED. The pinned elek no longer
          declares this input, so passing it produced a permanent yellow "unexpected input"
          annotation on every run. It is still accepted here so no caller breaks by continuing
          to pass it, and it is inert either way: the default was already '0', which disabled
          it. The behaviour it once guarded is gone at the pin, not merely switched off — the
          for(;;) downgrade loop it mitigated no longer exists. Do not restore the passthrough
          without first confirming the action declares the input again.
          Historical note follows.
          Changed-line warning threshold for council/thermos; '0' disables it.
          EHAC-2057 Fault 5: at the OLD pin (88813716) the default was 1_200 and a
          for(;;) loop silently downgraded council -> crosscheck -> solo on any large
          PR, so the job named "AI Review (Council)" ran a 2-lens crosscheck on
          eha_care #3515 (2,432 changed lines). At v1.1.4 the downgrade loop is gone
          and the threshold is warn-only, but we set it explicitly so the behaviour is
          self-documenting and pin-independent (CONTEXT D-05(i)).
      disable_mcp:
        type: string
        # FLIPPED '1' -> '0' (2026-08-15). The EHAC-2165 root cause was a FLOATING pi-mcp-adapter
        # install resolving to a broken release on every run. The pinned fork commits a lockfile
        # and installs with `npm ci`, so the adapter is version-pinned and no longer floats.
        # Restores inline PR comments, which this workaround has been costing fleet-wide.
        default: '0'
        description: >
          Emergency compatibility switch. '1' disables MCP and inline review comments;
          '0' uses the lockfile-pinned adapter and is the supported default.
      run_timeout_seconds:
        type: string
        default: '600'
        description: >
          EHAC-2167. Wall-clock timeout for EACH model run, passed through to elek. '600' is
          elek's own default, so callers that do not set it are byte-identical to before.
          Keep it below the review job's timeout-minutes (30) or the job dies first and the
          coverage record is lost.

          Note this is PER MODEL RUN, and a council is 4 lenses plus a validator — so the
          per-run budgets can structurally out-total the job cap even when every individual
          run is well inside its own budget. That is not hypothetical: eha-cloud-devops run
          31975072487 was cancelled at 20m09s with every per-run budget respected. If you
          raise this, check it against the job cap MULTIPLIED by nothing — the job cap is the
          real ceiling for the whole council, not for one run.

          Ported from eHealthAfrica/.github, where kemiqa passes '900'. Migrating that caller
          without this input would silently halve its budget — the reason this lands BEFORE
          any repo moves.

          Do NOT reach for this as a cure for a model that will not converge. kemiqa phase
          260721-j5t proved it: glm-5.2 as validator hung identically at 900s and at 600s
          ("turns=1, tools=0"). Benchmarking on 2026-08-10 agreed — glm-5.1 emitted nothing in
          620s and nothing at reasoning effort "low" in 284s. The fix for a non-converging
          model is a different model (EHAC-2166), not more time.
      job_timeout_minutes:
        type: number
        # DEFAULT 30 — byte-identical to the literal this replaced, so no consumer's
        # behaviour changes by upgrading. Only a caller that opts in gets more.
        #
        # Why it needs to be adjustable at all: the review job's real bound is
        # SERIAL, `setup + reviewer_cap + validator_cap`, because the four reviewer
        # lenses run in parallel but the validator runs after them. Measured setup on
        # eha_care is 37s, so at `run_timeout_seconds: '600'`:
        #
        #     37 + 600 + 600           = 1237s   fits in 1800s
        #     37 + 600 + 600 + 600     = 1837s   OVER 1800s  <- the retry made it over
        #
        # The second line was reachable until elek eha-v1.3.1 stopped `timeout` from
        # consuming the outer retry. A job killed by this cap yields NO coverage
        # record at all, which is strictly worse than an honest red — so this ceiling
        # is a correctness knob, not a cost knob.
        #
        # Raising it is close to free: GitHub bills elapsed minutes, not the cap, so a
        # higher ceiling changes the outcome only for runs that would otherwise be
        # guillotined mid-review. Raise it BEFORE raising run_timeout_seconds, never
        # after, and check the serial arithmetic above rather than one run's budget.
        default: 30
        description: >
          EHAC-2231. Wall-clock ceiling for the whole review job, in minutes. This is the
          ceiling for the ENTIRE council plus the validator, not for one model run — see
          run_timeout_seconds for the per-run budget and the serial arithmetic that
          relates them. A job killed by this cap loses the coverage record entirely.
      stall_timeout_seconds:
        type: string
        default: '0'
        description: >
          EHAC-2231. Stream-idle watchdog, in seconds, passed through to elek. A model run that
          emits no valid pi stream event for this long is terminated and reported with failure
          class `stall` — which `run_timeout_seconds` alone CANNOT distinguish from genuinely
          slow work, because one wall-clock timer gives both populations the same answer.

          Measured on eha_care #3291, job 95521213463: four lenses finished in 47-148s, then the
          `tests` lens produced 600 seconds of complete silence on a 3,612-character prompt, and
          its retry produced another 600 seconds of the same. Raising the wall clock does nothing
          for that shape; it only makes the silence longer.

          Default '0' — DISABLED — deliberately. A threshold has to be CALIBRATED from measured
          idle gaps on successful runs, and elek reports `timeToFirstEventSeconds` and
          `maxIdleSecondsObserved` for exactly that purpose. Imposing a guessed value fleet-wide
          would convert healthy slow lenses into false stalls, which is a worse failure than the
          one it replaces. Set it per caller once its own canary telemetry supports the number.

          Rule of thumb once you have the data: at least 3x the p99 successful idle gap, rounded
          up, and comfortably below run_timeout_seconds.

          Invalid values are a configuration FAILURE in elek and refuse to run — a watchdog that
          silently disables itself on a typo is not a watchdog.
      max_degraded_lenses:
        type: string
        # ONE VALUE, TWO INDEPENDENT DECISIONS. This input is passed to elek (which enforces it
        # while the review runs) AND to the coverage asserter as COUNCIL_MAX_DEGRADED (which
        # re-derives the same verdict from the recorded runs). They must not carry separate
        # defaults that merely happen to agree: that is indistinguishable from agreement by
        # accident, and it breaks silently the first time one side moves. The asserter fails
        # closed with a distinct policy-drift reason when the two disagree.
        #
        # DEFAULT '1', NOT '0'. The plan for this change proposed '0' for "backward-compatible
        # strict behavior". That is right for the PUBLIC elek action, which had no such input and
        # whose behaviour was strict. It is WRONG here: assert-review-coverage.mjs has shipped
        # DEFAULT_COUNCIL_MAX_DEGRADED = 1 since EHAC-2231's quorum landed in #26, so 1 is the
        # tolerance every consumer of this workflow already has. Declaring '0' and passing it
        # explicitly would revert eleven repositories to unanimity-of-availability — reintroducing
        # the exact defect that blocked four eha_care pull requests at once — as a side effect of
        # a change nobody asked to make. '1' is therefore the value that preserves behaviour.
        default: '1'
        description: >
          EHAC-2231. How many reviewer lenses may fail while the review still counts as having
          happened. Passed to BOTH elek and the coverage gate, which evaluate it independently.

          A council is a redundancy mechanism. Scoring it by unanimity-of-availability throws that
          redundancy away: with six model runs a single hung request discards otherwise useful
          review evidence and makes the council less reliable than its least reliable model.

          NEVER tolerated, at any value: a failed validator or validator-review run (nothing
          audited or reconciled the findings), a wiped reviewer panel (nothing read the diff), a
          failed run whose role is neither (it cannot be weighed), and a value that is not below
          the reviewer lens count. A degraded council is never silent either — it emits a warning
          naming every failed lens, its assigned model, its actual model and its failure class.

          Fails CLOSED on both sides: an invalid, negative or fractional value resolves to 0
          (strict), never to the default. A misconfigured tolerance must never widen what the
          gate accepts.
      openrouter_provider_preferences:
        type: string
        # NO DEFAULT, deliberately. Absent means elek sends no `provider` object at all and
        # OpenRouter routes exactly as it does today, so every caller that does not opt in is
        # byte-identical to before. A default here would change routing for twelve repos that
        # never asked for it.
        description: >
          EHAC-2280. OpenRouter provider-routing preferences, as a JSON OBJECT STRING, passed
          through to elek and merged into the request's `provider` field.

          WHY THIS EXISTS. EHAC-2280's premise is that unmanaged routing — not model choice —
          drives the 600s/900s exhaustion, and elek run 32527705565 produced the first hard
          number behind it: two concurrent observations of the SAME endpoint (`deepinfra/fp8`),
          seconds apart, reported generation times of 386 ms and 10,277 ms. A ~26x swing on one
          named endpoint, LARGER than the 8.8x spread measured between two different endpoints.

          That measurement is also why `order` pinning is not the answer and is rejected in
          CONTEXT: the pinned endpoint is itself wildly variable under load, so pinning trades a
          latency problem for an availability problem and does not even fix the latency.

          Parsed FAIL-CLOSED in elek: unparseable JSON, a non-object, or any key outside the
          thirteen documented OpenRouter routing keys refuses the run rather than silently
          routing unmanaged. Keep `allow_fallbacks` true — see the caller's own comment for why.
      reasoning_max_tokens:
        type: string
        # NO DEFAULT, and no caller sets it today. Shipped unset on purpose (R-4): the cap is
        # only now becoming measurable — `native_tokens_reasoning` came back 0 (DeepInfra) vs
        # 10 (Novita) in the same run — and a guessed ceiling would truncate reasoning models
        # mid-thought for a saving nobody has sized.
        description: >
          EHAC-2280. Upper bound on reasoning tokens per model run, passed through to elek.
          Unset everywhere by design; set it only once a caller's own
          `native_tokens_reasoning` telemetry supports the number.
      allowed_bots:
        type: string
        default: ''
        description: >
          EHAC-2167. Comma-separated EXACT-MATCH bot actor allowlist, e.g.
          'eha-clinics-renovate[bot]'. elek's isActorAllowed() denies every '*[bot]' actor
          unless it appears here, so with this unset — which was the only possible state
          before this input existed — bot-authored pull requests are NEVER reviewed. The
          coverage gate reports that honestly as NOT_REVIEWED, i.e. a GREEN check plus a
          warning, so it is a blind spot rather than a red.

          Default '' preserves exactly that behaviour. Opt in per repo; the actor name differs
          per org ('eha-clinics-renovate[bot]' vs 'renovate-bot-eha[bot]' in eHealthAfrica).
          Never use '*' — that would admit any bot, including one opening PRs from a fork.
      prompt:
        type: string
        default: 'Please review this PR for correctness, security, and potential issues.'
        description: >
          EHAC-2167. The review instruction, so a repo can shape its own review. The default
          is the sentence this workflow previously hardcoded, copied verbatim from eha_care's
          PR-template footer, so an unset caller is byte-identical to before.

          This input supplies the STRING ONLY. Whether a prompt is sent at all stays governed
          by the event gate at the elek step and is NOT caller-controllable — see EHAC-2099:
          a non-empty prompt is what short-circuits elek's trigger detection on a
          pull_request event, and making that a caller responsibility is precisely how a
          caller that forgets it runs green-but-no-op. kemiqa did exactly that for 18 days.
      scope_paths:
        type: string
        default: ''
        description: >
          EHAC-2060. Comma-separated globs describing which changed files warrant a review,
          evaluated INSIDE this workflow so an out-of-scope PR yields a green NOT_REVIEWED
          check instead of no check at all. Callers must express scope here rather than via
          `on.pull_request.paths`: a paths-filtered workflow never dispatches, so "not applicable"
          is indistinguishable from a broken integration. Empty means every file is in scope.
      pr_number:
        type: string
        default: ''
        description: >
          Pull-request number for events that do not carry one on the payload (issue_comment).
          Ignored when github.event.pull_request.number is present.
      actor_filter:
        type: string
        default: ''
        description: >
          Comma-separated usernames allowed to trigger a review. Exact match, whitespace
          trimmed.

          AUTHORITATIVE AND EXCLUSIVE FOR HUMANS — verified in
          EHA-Clinics/elek@3429e4a src/github/trigger.ts, which is the ref the elek
          step below actually installs. Setting this input NARROWS the human trigger surface
          to exactly the listed names:

            set    -> `listIncludes(actorFilter, actor)`, and isActorAuthorized then returns
                      false WITHOUT consulting repo permissions — there is no fallback.
            unset  -> isTrustedAssociation (OWNER|MEMBER|COLLABORATOR), falling back to a
                      repo-permission lookup (admin|maintain|write|triage).

          So an unlisted human gets NO review and NO fallback, behind a green check. Anyone
          who joins the org after the list is written is silently unreviewed until someone
          adds them: this list is live maintenance, not documentation. '*' disables the
          narrowing entirely.

          Bots never consult this list — they take the `allowed_bots` path above, which fork
          patch P6 decoupled from this one. Bots stay declined while `allowed_bots` is unset,
          which the coverage gate reports as NOT_REVIEWED (green + a loud warning), so
          bot-authored PRs do not produce a red storm.

          CORRECTION 2026-08-15: the previous revision said this list was "ADDITIVE, not
          exclusive" and cited elek@3748508 — pre-fork v1.1.4, where isActorAllowed did fall
          through to `return !actor.endsWith("[bot]")`. That fall-through does not exist at
          the pinned fork. The old wording was accurate for the elek this workflow used to
          install and wrong for the one it installs now; it was never re-verified when the
          fork was vendored in #23.

          It does NOT mitigate the `getGitDiff` surface, where the head branch name is
          interpolated into execSync and git refnames legally permit shell metacharacters
          (EHAC-2059). The real controls remain private repositories, fork PRs receiving no
          secrets, and mode:review.
    secrets:
      OPENROUTER_API_KEY:
        required: true
        description: 'Dedicated OpenRouter API key for the advisory AI-review workflow'

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: AI Code Review (${{ inputs.review_strategy }})
    runs-on: ubuntu-latest
    outputs:
      # Consumed by the `AI Review Coverage` job below. Measuring inside THIS job is
      # deliberate: the producer runs in the same checkout and the same git config as elek,
      # which collapses to zero the whole class of divergence between what elek measured and
      # what we measure (core.autocrlf, diff.noprefix, .gitattributes diff drivers,
      # diff.renames, the two-dot fallback, elek's own --depth=100 shallow boundary).
      coverage_json: ${{ steps.coverage.outputs.coverage_json }}
    # 10 min was too tight: multi-model thinking:high reviews of large diffs were
    # killed mid-run (job cancelled before posting), leaving stuck "analyzing…"
    # tracking comments. 20 gave headroom for the full-history checkout + review.
    #
    # Raised 20 -> 30 on 2026-08-16, together with max_turns 20 -> 30, because the two
    # ceilings interact and moving only the first would make failures LESS legible.
    #
    # `run_timeout_seconds` (600s) is per MODEL RUN, and a council is 4 lenses plus a
    # validator, so the per-run budgets can structurally out-total this job cap. Measured
    # over the last ~12 runs per repo:
    #
    #   eha-cloud-devops  median 203s  max 1209s -> CANCELLED at this cap
    #   eha-care-infra    median 243s  max  512s
    #   kemiqa            median  28s  max  964s  (~80% of a 20-minute cap)
    #
    # So the cap is already binding at the top of the range, and raising max_turns makes
    # the long tail longer. Without this, a lane that needs its extra turns would be
    # converted from a turn-ceiling FAILURE into a job CANCELLATION — strictly worse: a
    # turn-ceiling failure still emits a coverage record, whereas a cancelled job yields
    # `verdict: UNKNOWN` with `input_tokens: null` and no evidence at all. On kemiqa the
    # coverage result is advisory, but cancellation still loses the review and its evidence.
    #
    # Costs nothing on the common path: GitHub bills elapsed minutes, not the cap, and the
    # median run is under 4 minutes. It only changes the outcome for runs that would
    # otherwise be guillotined mid-review.
    # EHAC-2231: was a literal 30. See the job_timeout_minutes input for the serial
    # `setup + reviewer_cap + validator_cap` arithmetic this ceiling has to clear.
    timeout-minutes: ${{ inputs.job_timeout_minutes }}
    steps:
      - name: Checkout PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # EHAC-2060 — turn "the review did not apply" from an ABSENT check into a GREEN one.
      #
      # A caller that suppresses this workflow with `on.pull_request.paths` or a draft `if:`
      # cannot report a stable status: measured on eha_care #3574/#3576/#3554 (0 in-scope
      # files), no `AI Review Coverage` check run was created at all. That made "not
      # applicable" and "workflow missing" indistinguishable.
      #
      # So scope and draft state are evaluated HERE, as a verdict, instead of upstream as a
      # skip. The job always runs; only the elek step below is conditional. Cost is unchanged:
      # an out-of-scope PR still never invokes a model.
      #
      # EHAC-2294 adds a THIRD verdict on the same principle — a bot-authored pull request —
      # for a reason the other two do not share. Scope and draft are decided here because elek
      # cannot decide them; bot AUTHORSHIP is decided here because elek decides it WRONGLY, on
      # `github.actor` rather than on who wrote the code. See the branch below.
      - name: Resolve review scope
        id: scope
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SCOPE_PATHS: ${{ inputs.scope_paths }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
          # EHAC-2294: `github.event.issue.number` is the middle term and it is LOAD-BEARING.
          #
          # On an `issue_comment` event there is no `github.event.pull_request`, and neither
          # on-demand caller in eha_care or eha-care-infra passes `pr_number` (verified on
          # both default branches). So PR_NUMBER was EMPTY on every `@ai-review` comment, and
          # every lookup in this step was skipped: the author check below never ran, and the
          # changed-file lookup 404'd into its treat-as-in-scope warning.
          #
          # Caught live rather than reasoned about — the first `@ai-review` after the author
          # gate shipped ran a full council on a Renovate PR anyway (eha-care-infra #506, run
          # 32849221664, cancelled once observed). A comment on a pull request carries the PR
          # number as `issue.number`; that is the only place it appears on this event.
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number }}
          ALLOWED_BOTS: ${{ inputs.allowed_bots }}
        run: |
          set -euo pipefail

          # Draft state first: it suppresses regardless of paths.
          if [ "${IS_DRAFT:-false}" = "true" ]; then
            echo "in_scope=false" >> "$GITHUB_OUTPUT"
            echo "skip_reason=pull_request_is_draft" >> "$GITHUB_OUTPUT"
            echo "Draft pull request — review deferred until ready_for_review."
            exit 0
          fi

          # Resolve PR state and authorship in one API read. A comment can arrive after merge;
          # that is a deterministic decline, not a reason to spend model tokens on an empty diff.
          #
          # `allowed_bots` alone cannot do this. elek's isActorAllowed (src/github/trigger.ts:82)
          # reads `context.actor` — GITHUB_ACTOR, i.e. whoever caused THIS event. A Renovate PR
          # is opened by the bot and correctly declined, but the instant a human rebases it,
          # pushes to it, or reopens it, the actor is that human, the bot allowlist stops
          # applying, and a full council reads a regenerated lockfile.
          #
          # Measured 2026-08-22..24 across eha_care and eha-care-infra: 41 of 125 model runs —
          # 33% of all AI-review spend — were bot-authored pull requests, and ALL 41 of the 41
          # had a human as github.actor. Reference case: eha-care-infra run 32675708827, branch
          # renovate/node-services-(non-major), actor adothompson, executedStrategy council,
          # terminalReason completed.
          #
          # Resolved from the API, matching the changed-file lookup below and for the same
          # reason: the event payload carries `pull_request.user` only on pull_request events,
          # while PR_NUMBER above already spans the issue_comment path too. One lookup works for
          # both.
          #
          # FAILS OPEN, DELIBERATELY. A lookup that errors, or a repo whose API shape surprises
          # us, must not silence a review of human code — the cost of a needless council is
          # dollars, the cost of a silently skipped one is a defect reaching the base branch.
          # Same posture as the `could not list changed files` branch below.
          if [ -n "${PR_NUMBER:-}" ]; then
            if PR_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
                            --jq '[.state, .user.login, .user.type] | @tsv' 2>/dev/null)"; then
              PR_STATE="$(printf '%s' "$PR_JSON" | cut -f1)"
              AUTHOR_LOGIN="$(printf '%s' "$PR_JSON" | cut -f2)"
              AUTHOR_TYPE="$(printf '%s' "$PR_JSON" | cut -f3)"

              if [ "$PR_STATE" != "open" ]; then
                echo "in_scope=false" >> "$GITHUB_OUTPUT"
                echo "skip_reason=pull_request_not_open" >> "$GITHUB_OUTPUT"
                echo "Pull request is ${PR_STATE:-not open} — reporting NOT_REVIEWED without invoking a model."
                exit 0
              fi

              if [ "$AUTHOR_TYPE" = "Bot" ]; then
                # Honour allowed_bots exactly as elek does: `*` admits everything, otherwise
                # comma-separated EXACT match. Mirrors listIncludes (trigger.ts:48) — a
                # substring match here would admit a bot the action itself would decline, and
                # the two must not disagree about who is allowed.
                bot_allowed=0
                if [ "${ALLOWED_BOTS:-}" = "*" ]; then
                  bot_allowed=1
                else
                  while IFS= read -r allowed; do
                    allowed="${allowed// /}"
                    [ -n "$allowed" ] || continue
                    if [ "$allowed" = "$AUTHOR_LOGIN" ]; then bot_allowed=1; break; fi
                  done <<< "$(printf '%s' "${ALLOWED_BOTS:-}" | tr ',' '\n')"
                fi

                if [ "$bot_allowed" -eq 0 ]; then
                  echo "in_scope=false" >> "$GITHUB_OUTPUT"
                  echo "skip_reason=pr_author_is_bot_not_allowlisted" >> "$GITHUB_OUTPUT"
                  echo "Pull request authored by \"${AUTHOR_LOGIN}\" (a bot not in allowed_bots) — reporting NOT_REVIEWED, not skipping the check."
                  exit 0
                fi
                echo "Pull request authored by allowlisted bot \"${AUTHOR_LOGIN}\" — continuing."
              fi
            else
              echo "::warning::could not resolve the pull request state and author — treating it as open and human so the review still runs."
            fi
          fi

          # An empty scope_paths means "review everything" — never "review nothing".
          if [ -z "${SCOPE_PATHS// /}" ]; then
            echo "in_scope=true" >> "$GITHUB_OUTPUT"
            echo "skip_reason=" >> "$GITHUB_OUTPUT"
            echo "No scope_paths configured — every changed file is in scope."
            exit 0
          fi

          # Changed files from the API, not from git: the caller may run on events where the
          # merge-base is not checked out, and a failed lookup must not read as "out of scope".
          if ! FILES="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" \
                          --paginate --jq '.[].filename')"; then
            echo "::warning::could not list changed files — treating the PR as IN SCOPE so the review still runs."
            echo "in_scope=true" >> "$GITHUB_OUTPUT"
            echo "skip_reason=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A PR with no files at all is not evidence of being out of scope.
          if [ -z "$FILES" ]; then
            echo "::warning::the pull request reports no changed files — treating as IN SCOPE."
            echo "in_scope=true" >> "$GITHUB_OUTPUT"
            echo "skip_reason=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          matched=0
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            # Read patterns from a here-string rather than `for p in $SCOPE_PATHS`: word
            # splitting an unquoted variable is how the same shape bit us three times in
            # Phase 70. IFS=, handles the comma-separated input explicitly.
            while IFS= read -r p; do
              p="${p// /}"
              [ -n "$p" ] || continue
              # $p is deliberately unquoted below: it is a glob, not a literal.
              # shellcheck disable=SC2254
              case "$f" in
                $p) matched=1; break 2 ;;
              esac
            done <<< "$(printf '%s' "$SCOPE_PATHS" | tr ',' '\n')"
          done <<< "$FILES"

          if [ "$matched" -eq 1 ]; then
            echo "in_scope=true" >> "$GITHUB_OUTPUT"
            echo "skip_reason=" >> "$GITHUB_OUTPUT"
            echo "At least one changed file is in scope — running the review."
          else
            echo "in_scope=false" >> "$GITHUB_OUTPUT"
            echo "skip_reason=no_files_in_review_scope" >> "$GITHUB_OUTPUT"
            echo "No changed file matches ${SCOPE_PATHS} — reporting NOT_REVIEWED, not skipping the check."
          fi

      - name: AI Code Review via OpenRouter
        # EHAC-2060: conditional on the STEP, never on the job — the coverage job must still
        # run and still publish a verdict. `needs.review.result` stays `success`.
        if: steps.scope.outputs.in_scope == 'true'
        # `id: review` is load-bearing (EHAC-2057 Fault 4): elek's action.yml has declared
        # review_summary_json / review_summary_path / input_tokens / output_tokens /
        # cost_usd / conclusion as outputs at EVERY ref, and all of them were unreachable
        # purely for want of a step id. The coverage measurement below consumes them.
        id: review
        uses: EHA-Clinics/elek@22d3edb144d568d69260c238ef22e14f9d8b0b04 # eha-v1.4.2
        with:
          # pi's native openrouter adapter — elek's tested path. The OpenAI-compatible
          # Databricks AI Gateway (provider: openai) hung pi indefinitely on tool-enabled
          # reasoning-model requests, regardless of thinking/max_turns/elek version.
          provider: openrouter
          openrouter_api_key: ${{ secrets.OPENROUTER_API_KEY }}
          # Council strategy + per-model cost control.
          review_strategy: ${{ inputs.review_strategy }}
          review_models: ${{ inputs.review_models }}
          validator_model: ${{ inputs.validator_model }}
          severity_threshold: ${{ inputs.severity_threshold }}
          max_cost_usd: ${{ inputs.max_cost_usd }}
          cost_rates: ${{ inputs.cost_rates }}
          # EHAC-2057 Fault 5 mitigation + T-2057-02 compensating control.
          actor_filter: ${{ inputs.actor_filter }}
          # Primary/fallback model + reasoning knobs.
          model: ${{ inputs.model }}
          trigger_phrase: ${{ inputs.trigger_phrase }}
          # EHAC-2099: make the PR-event trigger EXPLICIT instead of incidental.
          #
          # `detectTrigger` (elek src/github/trigger.ts:11-46) fires only on a non-empty
          # `prompt`, on the trigger phrase appearing in `triggerText`, or on a `pi` label.
          # On a pull_request event `triggerText` is the PR BODY, so before this line
          # auto-review depended entirely on the caller repo's PR template happening to
          # contain "@ai-review". A hand-written body meant elek exited in ~2s with
          # `conclusion: skipped` while this job still reported pass (eha_care #3530; 12 of
          # its 15 preceding merged PRs also had no phrase in the body). A non-empty prompt
          # short-circuits detection at run.ts:16-18, before it can return null.
          #
          # It is also load-bearing that detection runs at run.ts:108 — BEFORE resolveMode
          # (205) and resolveReviewPlan (217) — so `mode: review` never bypassed this.
          #
          # THE CONDITIONAL IS LOAD-BEARING; DO NOT MAKE THIS UNCONDITIONAL. On the
          # issue_comment / pull_request_review_comment paths (ai-review-on-demand.yml) a
          # non-empty prompt wins at run.ts:16-18 and would DISCARD the reviewer's own
          # words — the comment text is what becomes `userRequest` -> buildPrompt
          # (run.ts:463). "@ai-review focus only on the SQL in ehr-db.ts" would silently
          # become this generic sentence. workflow-invariants.test.mjs asserts both that
          # the prompt exists AND that it stays gated on pull_request.
          #
          # The sentence is copied verbatim from eha_care's PR template footer, so a forced
          # review is byte-identical to a template-kept one: this RESTORES the intended
          # behaviour rather than changing what the reviewer is asked to do.
          #
          # Bots are unaffected: isActorAllowed runs AFTER trigger detection (run.ts:116),
          # so an unlisted bot still declines and the NOT_REVIEWED path that keeps Renovate
          # from becoming a permanent red is untouched.
          #
          # EHAC-2167: the STRING now comes from an input so a repo can shape its own review.
          # The GATE deliberately does not — `inputs.prompt` supplies the text, the
          # `github.event_name` condition still decides whether any prompt is sent at all.
          # Letting a caller control that is how EHAC-2099 happened.
          prompt: ${{ github.event_name == 'pull_request' && inputs.prompt || '' }}
          thinking: ${{ inputs.thinking }}
          max_turns: ${{ inputs.max_turns }}
          mode: ${{ inputs.mode }}
          # EHAC-2167, both ported from eHealthAfrica/.github. Without allowed_bots this
          # workflow cannot review a bot-authored PR at all; without run_timeout_seconds a
          # caller cannot raise the per-run budget below the job's 20-minute cap.
          allowed_bots: ${{ inputs.allowed_bots }}
          run_timeout_seconds: ${{ inputs.run_timeout_seconds }}
          # EHAC-2231. The stream-idle watchdog and the reviewer-degradation tolerance. Both
          # default to a value that preserves existing behaviour, and both are declared as
          # workflow inputs so a caller opts in explicitly rather than inheriting a guess.
          stall_timeout_seconds: ${{ inputs.stall_timeout_seconds }}
          max_degraded_lenses: ${{ inputs.max_degraded_lenses }}
          # EHAC-2280. THE JOB CAP, forwarded to elek so its serial-arithmetic guard can
          # actually see it. This input has existed since EHAC-2231 and has always driven
          # `timeout-minutes:` above — but it was never passed to the action, so elek could
          # not check `setup + reviewer_cap + validator_cap` against the ceiling that will
          # kill the job. Without this line elek's guard reports `unchecked` on EVERY run in
          # the fleet: shipped, wired, and structurally incapable of firing.
          #
          # The guard has three outcomes, and only the first two are conclusions: PASS (the
          # arithmetic fits), FAIL (it does not — refused loudly, before any model runs,
          # naming both numbers), and `unchecked` + a `::warning::` when the caller sends no
          # job cap. It never reports that the arithmetic was checked and fine when it could
          # not check.
          job_timeout_minutes: ${{ inputs.job_timeout_minutes }}
          # EHAC-2280. Both UNSET fleet-wide unless a caller opts in; see the input
          # declarations for the measurement behind the routing knob and for why the
          # reasoning cap ships unset.
          openrouter_provider_preferences: ${{ inputs.openrouter_provider_preferences }}
          reasoning_max_tokens: ${{ inputs.reasoning_max_tokens }}
          sticky_comment: true
          # Structural safety: elek's MCP server only exposes create_inline_comment
          # and update_tracking_comment. No approve/merge/close code paths exist.
          # Path exclusion is no longer a workflow input — it lives in .elek.yml
          # ignore_paths (elek does not accept file-pattern inputs at this SHA).
        env:
          # Emergency compatibility switch only. The current action installs the committed
          # lockfile and local adapter; callers should leave this at its supported default, 0.
          ELEK_DISABLE_MCP: ${{ inputs.disable_mcp }}

      - name: Checkout coverage gate scripts
        # Placed AFTER elek so this extra directory is never in view of elek's read/grep
        # tools. It cannot affect elek's own measurement either way: `git diff
        # origin/base...origin/head` is a ref-to-ref diff and ignores untracked paths.
        #
        # `if: always()` is load-bearing and was missing. A step with no `if:` defaults to
        # `success()`, so whenever the elek step FAILED this checkout silently skipped — and
        # then the producer, which correctly carries `if: always()`, ran with its own script
        # absent and died on `Cannot find module .../measure-review-coverage.mjs`. The
        # "always emit a coverage record" property was therefore false in exactly the case it
        # exists for: a broken review. Observed on runs 31381064913, 31377112277, 31373475349,
        # 31372529264 and 31372514323 — every failed review since the gate shipped.
        #
        # The gate still failed CLOSED (the asserter reds on REVIEW_RESULT=failure), so this
        # was never a fail-open. What was lost is the evidence: no per-file inventory and no
        # model attribution, precisely when the question "which lens died?" matters most.
        if: always()
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Resolve the repository and immutable commit of this called workflow. This keeps
          # the executed gate byte-identical to the reviewed gate without a follow-up pin PR.
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ai-review-gate
          sparse-checkout: scripts/ai-review-coverage
          persist-credentials: false
          fetch-depth: 1

      - name: Check caller workflow shape
        # EHAC-2060/EHAC-2167. Runs in the REVIEW job because that is the only place both
        # trees exist at once: the calling repo is checked out at the workspace root (step
        # "Checkout PR") and this repo's gate scripts are in .ai-review-gate (the step above).
        #
        # WARN-ONLY for now, deliberately. This is a new signal landing across twelve repos
        # simultaneously; making it fail closed on day one would red PRs that have nothing to
        # do with the change that introduced it. Set CALLER_SHAPE_MODE to 'enforce' only after
        # every audited caller reports clean; enforcement still does not make AI branch-required.
        #
        # `if: always()` is load-bearing: the shape of the caller is exactly what needs
        # reporting when the review DIED, and a step defaulting to success() would skip then.
        # NO `continue-on-error:` here, deliberately. That key is an error SUPPRESSOR — it
        # makes a failing step report green — and it is one of the two mechanisms
        # workflow-invariants.test.mjs exists to reject, because it is how EHAC-2057 became a
        # gate that could not fail. Warn-vs-enforce is carried by CALLER_SHAPE_MODE, which
        # controls the script's exit code honestly. When this is moved to 'enforce' it
        # must go red, and no suppressor may be sitting here to stop it.
        if: always()
        env:
          CALLER_WORKFLOWS_DIR: .github/workflows
          CALLER_SHAPE_MODE: warn
        run: node .ai-review-gate/scripts/ai-review-coverage/assert-caller-shape.mjs

      - name: Measure review coverage
        id: coverage
        # Must emit even when the elek step failed — a broken review still has to produce a
        # coverage record, and the producer itself can never exit non-zero.
        if: always()
        env:
          REVIEW_SUMMARY_JSON: ${{ steps.review.outputs.review_summary_json }}
          REVIEW_CONCLUSION: ${{ steps.review.outputs.conclusion }}
          REVIEW_INPUT_TOKENS: ${{ steps.review.outputs.input_tokens }}
          REVIEW_COST_USD: ${{ steps.review.outputs.cost_usd }}
          # The LITERAL pinned SHA, not an expression: this is what makes branch U1 detect a
          # future elek bump that forgets to re-verify elek-prompt-budget.mjs.
          ELEK_REF: 22d3edb144d568d69260c238ef22e14f9d8b0b04
          REQUESTED_STRATEGY: ${{ inputs.review_strategy }}
          ACTOR_FILTER: ${{ inputs.actor_filter }}
          # EHAC-2103: the CONFIGURED council, so the coverage record can put what we asked for
          # next to what modelRuns says actually ran. Until now these values reached the elek
          # step only, which is why the gate could not check the comment's model claims at all.
          # Reported, not yet asserted — see renderJobSummary for why (label normalisation).
          REVIEW_MODELS: ${{ inputs.review_models }}
          VALIDATOR_MODEL: ${{ inputs.validator_model }}
          # EHAC-2060: why the elek step did not run, when it did not. Empty means it ran.
          # The producer turns this into a deterministic NOT_REVIEWED verdict (green + a
          # warning), which is what makes an out-of-scope PR reportable rather than absent.
          SKIP_REASON: ${{ steps.scope.outputs.skip_reason }}
          # EHAC-2231. The SAME declared value elek was given, carried into COVERAGE_JSON so the
          # asserter can compare what the producer was told against what IT was told. Without
          # this the two halves would each apply their own tolerance and a mismatch would be
          # invisible — a gate and a producer disagreeing about policy while both report success.
          COUNCIL_MAX_DEGRADED: ${{ inputs.max_degraded_lenses }}
          # For the `gh api repos/{repo}/pulls/{n}` lookup on the issue_comment path.
          GITHUB_TOKEN: ${{ github.token }}
        run: node .ai-review-gate/scripts/ai-review-coverage/measure-review-coverage.mjs

      # ═══════════════════════════════════════════════════════════════════════════════════
      # EHAC-2280 — make the coverage record a FIRST-CLASS, ADDRESSABLE RESOURCE.
      #
      # Until now the record's only post-hoc surface was the runner's INCIDENTAL ECHO of the
      # `COVERAGE_JSON` env block in the `AI Review Coverage` job log. That echo is a side
      # effect of how Actions renders a step's environment — nobody published it, nothing
      # guarantees it, and its format is not a contract. The job summary is no substitute:
      # `renderJobSummary` prints Role/Lens/Model/Result and omits the failure class entirely.
      #
      # The consequence is the defect AC #3 exists to prevent. Any reader scraping that log
      # sees an ABSENT echo and a CLEAN parse as the same thing, so it reports a PERFECT
      # STREAK from an empty read — a measurement that cannot come out badly. Giving the
      # record a real artifact removes the ambiguity at its root: the artifact is either
      # there and parses, or the reader says so and exits non-zero.
      # ═══════════════════════════════════════════════════════════════════════════════════
      - name: Persist coverage record
        # `if: always()` for the same reason the producer carries it: a BROKEN review is
        # exactly when the record matters, and a step with no `if:` defaults to success().
        if: always()
        env:
          # T-2280-04. The record reaches the script through an ENV VARIABLE and is read as
          # "$COVERAGE_JSON". It is never interpolated into the `run:` body — `${{ }}` is
          # substituted TEXTUALLY before the shell parses the line, so a record containing
          # shell metacharacters would execute. workflow-invariants.test.mjs asserts the
          # expression does not appear in this run: body.
          COVERAGE_JSON: ${{ steps.coverage.outputs.coverage_json }}
        # NO `continue-on-error:` here or on the upload below, deliberately: that key is an
        # error SUPPRESSOR and workflow-invariants.test.mjs rejects it repo-wide. If the
        # record cannot be persisted, that is a fault and must read as one.
        run: |
          set -euo pipefail
          printf '%s\n' "$COVERAGE_JSON" > "${RUNNER_TEMP}/coverage.json"
          # Validate it is a JSON OBJECT before upload. An empty output would otherwise
          # upload a zero-byte artifact that every reader would have to special-case —
          # which is how "absent" quietly becomes "fine" again.
          node -e '
            const fs = require("node:fs");
            const raw = fs.readFileSync(process.env.RUNNER_TEMP + "/coverage.json", "utf8").trim();
            if (!raw) throw new Error("coverage record is EMPTY — the producer emitted no output");
            const parsed = JSON.parse(raw);
            if (typeof parsed !== "object" || parsed === null || Array.isArray(parsed))
              throw new Error("coverage record is not a JSON object: " + typeof parsed);
            console.log("coverage record persisted, " + raw.length + " bytes");
          '

      - name: Upload coverage record
        if: always()
        # v7.0.1, resolved from the tag to a 40-hex SHA (T-2280-06). A floating major ref would
        # let a third party's code change underneath a pinned caller.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ai-review-coverage
          path: ${{ runner.temp }}/coverage.json
          # A run that produced no record must FAIL here rather than upload nothing and
          # report success — an absent artifact would otherwise read to the streak reader
          # as an ordinary miss instead of a fault.
          if-no-files-found: error
          retention-days: 90
        # No permissions change is needed: upload-artifact v4 authenticates with the runtime
        # token, not the GITHUB_TOKEN scopes declared at the top of this file.

  coverage-gate:
    # The job NAME below is an observability API contract string. NEVER RENAME IT casually:
    # downstream automation and dashboards consume the exact context string. It is not a
    # branch-protection requirement; the AI review remains permanently advisory.
    name: AI Review Coverage
    needs: review
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # This job carries NO error-suppression key and NO `if:` other than always().
    # GitHub reports a job suppressed that way as GREEN, and a *skipped* check counts as
    # PASSING, so either would rebuild the exact defect EHAC-2057 exists to fix.
    # `workflow-invariants.test.mjs` asserts both properties against this shipped file.
    # No `actions: read` either: U3 comes from review_summary_json, so the job-log API is
    # never needed and the caller-permission cascade does not apply.
    steps:
      - name: Checkout coverage gate scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ai-review-gate
          sparse-checkout: scripts/ai-review-coverage
          persist-credentials: false
          fetch-depth: 1

      - name: Assert review coverage
        env:
          REVIEW_RESULT: ${{ needs.review.result }}
          COVERAGE_JSON: ${{ needs.review.outputs.coverage_json }}
          # EHAC-2231. The same declared value the producer and elek received. The asserter
          # re-derives the quorum verdict from the recorded runs independently — it never trusts
          # elek's own status — and fails closed with a distinct policy-drift reason if the
          # producer was told something different.
          COUNCIL_MAX_DEGRADED: ${{ inputs.max_degraded_lenses }}
        run: node .ai-review-gate/scripts/ai-review-coverage/assert-review-coverage.mjs
