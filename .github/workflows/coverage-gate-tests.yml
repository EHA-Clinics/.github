# Tests for the AI review coverage gate (EHAC-2057).
#
# This repository is the CANONICAL home of scripts/ai-review-coverage/ — the reusable
# ai-code-review.yml workflow checks it out at `job.workflow_sha` and executes it inside the
# caller's job. Both eha_care and eha-care-infra are private, so neither can be the
# canonical source for the other's run; EHA-Clinics/.github is public, so the default
# GITHUB_TOKEN reads it from either caller with no new secret.
#
# The point of running the suite HERE is that the tested copy and the executed copy are the
# same copy. A test-only mirror in an app repo can stay green while the code that actually
# runs is broken — precisely the vacuous-gate class EHAC-2057 exists to kill.
#
# There is deliberately NO error-suppression key anywhere in this file.

name: Coverage Gate Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Coverage Gate Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The reusable workflow now checks out its own `job.workflow_sha`, so the suite
          # asserts that context contract directly and needs only the revision under test.
          fetch-depth: 1

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # R14. A LITERAL version, not a floor and not a range. The gate now imports the
          # vendored TypeScript packer (scripts/ai-review-coverage/vendor/diff-context.ts)
          # directly, which needs a runtime with UNFLAGGED type stripping. The measured
          # pre-change value here was `22`; an earlier draft of the verification grepped for a
          # version-SHAPED pattern, which `22` already satisfied — a probe that was green before
          # the change and could not go red. The spec asserts this exact string, and separately
          # asserts the capability BEHAVIOURALLY by importing the module in a bare node process.
          node-version: 24.10.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run coverage-gate specs
        run: pnpm test

      # Belt-and-braces: prove the gate is still able to fail, from the shell, without
      # Vitest in the loop. The real 137,015-char PR #3515 diff must drive PARTIAL_SOURCE
      # and a non-zero assert exit. If this step ever passes trivially, the gate is vacuous.
      - name: Prove the fixture-driven red end-to-end
        env:
          ELEK_REF: 22d3edb144d568d69260c238ef22e14f9d8b0b04
          REQUESTED_STRATEGY: council
          EXECUTED_STRATEGY: council
          REVIEW_INPUT_TOKENS: '83000'
          # EHAC-2231. Supplied EXPLICITLY, and identically to what the asserter is given below,
          # so U8 (producer/gate policy drift) cannot fire here. Same reasoning as the healthy
          # council above: the ONLY thing capable of redding this proof must be the truncation.
          # EHAC-2162: a HEALTHY council must be supplied here. Without it the record carries
          # no modelRuns while input_tokens is positive, U7 fires, and this step still exits 1
          # — passing for a reason that has nothing to do with truncation. That would leave the
          # step green even if PARTIAL_SOURCE detection broke completely, which is precisely
          # the vacuity this step exists to rule out. Every run below must succeed so that the
          # ONLY thing capable of redding this proof is the truncation itself.
          # The prompt budget travels HERE, in the run's own report, exactly as in production.
          # It must be supplied: the budget is per-model and reservation-aware, and at the
          # packer's own default this 137,015-char diff is inlined WHOLE and cuts nothing — so
          # without a reported budget this step would measure COMPLETE and correctly declare
          # the gate vacuous. 61_000 is the budget at which this diff reproduces the rollup
          # recorded before the version move (6 whole, 4 cut production files, 5 cut
          # non-source), so the truncation proven here is the SAME truncation as before.
          REVIEW_SUMMARY_JSON: >-
            {"run":{"conclusion":"success"},
             "review":{"requestedStrategy":"council","executedStrategy":"council"},
             "cost":{"inputTokens":83000},
             "promptBudgets":[
               {"lensId":"risk","modelLabel":"deepseek/deepseek-v4-pro",
                "reservedChars":259000,"diffPromptBudgetChars":61000,"excludePaths":[]}],
             "modelRuns":[
               {"role":"reviewer","lensId":"risk","modelLabel":"deepseek/deepseek-v4-pro","conclusion":"success"},
               {"role":"reviewer","lensId":"design","modelLabel":"xiaomi/mimo-v2.5-pro","conclusion":"success"},
               {"role":"reviewer","lensId":"tests","modelLabel":"openrouter/z-ai/glm-5.1","conclusion":"success"},
               {"role":"validator","modelLabel":"openrouter/z-ai/glm-5.1","conclusion":"success"}]}
        run: |
          set -euo pipefail
          COV="$(COUNCIL_MAX_DEGRADED=1 node scripts/ai-review-coverage/measure-review-coverage.mjs \
                   --diff-file scripts/ai-review-coverage/fixtures/pr-3515.diff)"
          node -e 'const c=JSON.parse(process.argv[1]);if(c.verdict!=="PARTIAL_SOURCE")throw new Error("expected PARTIAL_SOURCE, got "+c.verdict)' "$COV"
          rc=0
          OUT="$(REVIEW_RESULT=success COVERAGE_JSON="$COV" COUNCIL_MAX_DEGRADED=1 \
            node scripts/ai-review-coverage/assert-review-coverage.mjs)" || rc=$?
          printf '%s\n' "$OUT"
          if [ "$rc" -ne 1 ]; then
            echo "::error::the coverage gate did NOT fail on a truncating diff (exit $rc) — it is vacuous"
            exit 1
          fi
          # Assert the REASON, not merely the exit code. An exit-1 that happens for an
          # unrelated reason proves nothing about truncation detection.
          case "$OUT" in
            *PARTIAL_SOURCE*) ;;
            *) echo "::error::gate exited 1 but not for PARTIAL_SOURCE — the red is not attributable to truncation"; exit 1 ;;
          esac
          case "$OUT" in
            *U7*) echo "::error::U7 fired in the truncation proof — the fixture council is not healthy, so this step is no longer a truncation test"; exit 1 ;;
          esac
          case "$OUT" in
            *U8*) echo "::error::U8 fired in the truncation proof — producer and asserter were given different tolerances, so this step is no longer a truncation test"; exit 1 ;;
          esac
          echo "fixture-driven red proven (assert exited $rc, verdict PARTIAL_SOURCE, no unrelated branches)"
