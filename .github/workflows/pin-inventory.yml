# Pin Inventory — which callers of the org reusable AI-review workflows pin WHICH org SHA.
#
# Observability, not a gate. "Fleet rollout complete" was claimed for EHAC-2833 while five of
# seven consumers were still two org re-pins behind (EHAC-2841 correction, EHAC-2845) — this
# workflow exists so that claim is a MEASURED statement, not a memory.
#
# WHY PER-REPO CONTENTS CALLS. The census in ai-review-streak reads each caller's OWN runs
# (its own token, its own repo). A central inventory must cross the org: it reads each
# consumer's caller workflows and extracts the `uses: ...@<sha>` pins. Private consumers need
# a token with repo read access — `PIN_INVENTORY_TOKEN`. WITHOUT that secret this job still
# runs and reports UNVERIFIED for every repo it cannot read: a report that silently said
# "verified" about unreadable repos would be the vacuous-pass shape the rest of this gate
# family exists to prevent. The workflow-invariants test pins that behaviour.
#
# Pin VARIANCE is deliberate policy, not failure: consumers adopt at their own pace and the
# report carries version AGE (re-pins behind) rather than enforcing one universal SHA. What
# must never happen is the report FAILING to say which repos it could not see.
name: Pin Inventory

on:
  workflow_dispatch:
    inputs:
      consumers:
        description: 'Comma-separated owner/name list to inspect. Empty = the declared consumer list below.'
        required: false
        default: ''
  schedule:
    - cron: '3 6 * * 4'

permissions:
  contents: read

env:
  # The declared consumer list. New consumers are ADDED HERE by their rollout PR
  # (EHAC-2845 is the current matrix).
  CONSUMERS: 'EHA-Clinics/eha_care,EHA-Clinics/eha-care-infra,EHA-Clinics/eha-clinic,EHA-Clinics/eha-clinic-recruitment-odoo-api,EHA-Clinics/get-care,EHA-Clinics/ehacare-clinical-decision-support,EHA-Clinics/eha-care-mobile'

jobs:
  inventory:
    name: AI review pin inventory
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inventory caller pins across the declared consumers
        env:
          GH_TOKEN: ${{ secrets.PIN_INVENTORY_TOKEN || github.token }}
          CONSUMERS: ${{ github.event.inputs.consumers != '' && github.event.inputs.consumers || env.CONSUMERS }}
        run: |
          set -uo pipefail
          org_head="$(gh api repos/EHA-Clinics/.github/commits/main --jq '.sha')"
          echo "org main: ${org_head}"

          md="${GITHUB_STEP_SUMMARY:-/tmp/pin-inventory.md}"
          {
            echo "## AI review pin inventory"
            echo ""
            echo "Generated $(date -u +%FT%TZ). Org main: \`${org_head:0:8}\`."
            echo ""
            echo "| repo | workflow | pin | drift (re-pins behind) |"
            echo "|---|---|---|---|"
          } >> "$md"

          unverified=0
          IFS=',' read -ra repos <<< "${CONSUMERS}"
          for repo in "${repos[@]}"; do
            repo="$(echo "$repo" | tr -d '[:space:]')"
            [ -z "$repo" ] && continue
            for wf in ai-code-review.yml ai-review-on-demand.yml ai-review-streak.yml; do
              sha="$(gh api "repos/${repo}/contents/.github/workflows/${wf}" --jq '.content' 2>/dev/null | base64 -d | grep -oE '@[0-9a-f]{40}' | head -1 | tr -d '@' || true)"
              if [ -z "${sha:-}" ]; then
                echo "| $repo | $wf | UNVERIFIED (unreadable) | ? |" >> "$md"
                unverified=$((unverified + 1))
                continue
              fi
              # Drift = how many org re-pins since the caller's pin. Counted via the org
              # commit history, so a caller two re-pins behind reads "2".
              drift="$(gh api "repos/EHA-Clinics/.github/commits?path=.github/workflows/ai-code-review.yml&sha=main&per_page=100" --jq --arg sha "$sha" '[.[] | .sha][::-1] as $chain | ($chain | index($sha)) // -1 | if . < 0 then "unknown" else ($chain | length - 1 - .) end' 2>/dev/null || echo unknown)"
              echo "| $repo | $wf | \`${sha:0:8}\` | ${drift} |" >> "$md"
            done
          done
          cat "$md"
          if [ "$unverified" -gt 0 ]; then
            echo "::warning::${unverified} caller workflow(s) could NOT be read (missing PIN_INVENTORY_TOKEN or absent file). They are reported UNVERIFIED above, not silently skipped."
          fi
